<div class="row justify-content-center py-2 py-sm-5">
  <div class="col-12 col-md-8 col-lg-5 col-xl-4">
    <div class="surface-card p-3 p-sm-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
          <i class="bi bi-stars"></i>
        </div>
        <h1 class="h4 fw-bold mb-1 text-dark">Recruiter Sign In</h1>
        <p class="text-muted small">Access your ResumeIQ talent screening workspace</p>
      </div>

      <form ng-submit="vm.login()" novalidate>
        <div class="mb-3">
          <label class="form-label-iq">Work Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control form-control-iq border-start-0 ps-0" ng-model="vm.loginData.email" placeholder="name@company.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label-iq">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control form-control-iq border-start-0 ps-0" ng-model="vm.loginData.password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-iq w-100 py-2 mb-3" ng-disabled="vm.isLoading">
          <span ng-if="vm.isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          <span>{{ vm.isLoading ? 'Authenticating...' : 'Sign In to Portal' }}</span>
        </button>

        <!-- Instant 1-Click Demo Login Box -->
        <div class="p-3 rounded-2 mb-3" style="background-color: var(--primary-subtle); border: 1px dashed var(--primary-border);">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="small fw-bold" style="color: var(--primary);">
              <i class="bi bi-lightning-charge-fill me-1"></i> Instant Demo Access
            </span>
            <span class="badge bg-white text-primary border border-primary border-opacity-25 small" style="font-size: 0.7rem;">Ready</span>
          </div>
          <p class="small text-muted mb-2" style="font-size: 0.8rem; line-height: 1.4;">
            Evaluate candidate ranking and semantic resume scoring with pre-seeded data:
          </p>
          <button type="button" class="btn btn-sm btn-white w-100 py-2 border shadow-sm fw-semibold text-primary" ng-click="vm.fillDemoCredentials()">
            <i class="bi bi-person-check-fill me-1"></i> Sign In as Demo Recruiter (recruiter@demo.com)
          </button>
        </div>

        <div class="text-center pt-2 border-top">
          <span class="text-muted small">New to ResumeIQ? </span>
          <a href="#!/register" class="small fw-semibold text-primary">Register Company Account</a>
        </div>
      </form>
    </div>
  </div>
</div>
