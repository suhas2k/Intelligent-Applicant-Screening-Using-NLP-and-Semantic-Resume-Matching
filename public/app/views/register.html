<div class="row justify-content-center py-2 py-sm-5">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <div class="surface-card p-3 p-sm-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h1 class="h4 fw-bold mb-1 text-dark">Create Recruiter Account</h1>
        <p class="text-muted small">Deploy intelligent candidate screening for your organization</p>
      </div>

      <form ng-submit="vm.register()" novalidate>
        <div class="row g-3 mb-3">
          <div class="col-12 col-sm-6">
            <label class="form-label-iq">Full Name *</label>
            <input type="text" class="form-control form-control-iq" ng-model="vm.registerData.name" placeholder="Sarah Lin" required>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label-iq">Company / Org *</label>
            <input type="text" class="form-control form-control-iq" ng-model="vm.registerData.company" placeholder="Acme Technologies" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label-iq">Work Email *</label>
          <input type="email" class="form-control form-control-iq" ng-model="vm.registerData.email" placeholder="sarah.lin@company.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label-iq">Password (min 6 characters) *</label>
          <input type="password" class="form-control form-control-iq" ng-model="vm.registerData.password" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary-iq w-100 py-2 mb-3" ng-disabled="vm.isLoading">
          <span ng-if="vm.isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          <span>{{ vm.isLoading ? 'Creating Account...' : 'Complete Registration' }}</span>
        </button>

        <div class="text-center pt-2 border-top">
          <span class="text-muted small">Already have an account? </span>
          <a href="#!/login" class="small fw-semibold text-primary">Sign In</a>
        </div>
      </form>
    </div>
  </div>
</div>
